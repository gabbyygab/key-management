{# Shown inside the AJAX modal when an action is refused by a business rule. #}
<div class="flex min-h-0 flex-1 flex-col">
  <div class="kt-modal-scroll min-h-0 flex-1 overflow-y-auto p-6 text-center">
    <span aria-hidden="true" class="mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-amber-50">
      <i data-lucide="shield-alert" class="w-5 h-5 text-amber-700"></i>
    </span>
    <h2 class="text-[15px] font-bold text-stone-900">{{ title|default:"Action not available" }}</h2>
    <p class="mt-1.5 text-[13px] text-stone-600">{{ reason }}</p>
  </div>
  <div class="flex shrink-0 items-center justify-end border-t border-stone-200 bg-white px-5 py-3">
    <button type="button" data-modal-close class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-[13px] font-semibold text-stone-700 hover:bg-stone-50">Close</button>
  </div>
</div>
