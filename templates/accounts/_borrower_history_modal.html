<div class="flex shrink-0 items-center justify-between gap-3 border-b border-stone-200 bg-white px-5 py-4">
  <div class="flex min-w-0 items-center gap-3">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-[#1E6B4A]/20 bg-[#1E6B4A]/10 text-[#1E6B4A]">
      <i data-lucide="history" aria-hidden="true" class="h-5 w-5"></i>
    </div>
    <div class="min-w-0">
      <h2 class="truncate text-[15px] font-bold text-stone-900">{{ borrower.full_name }}</h2>
      <p class="text-[12px] text-stone-500"><span class="font-mono">{{ borrower.id_number }}</span> · {{ borrower.get_borrower_type_display }}{% if borrower.department %} · {{ borrower.department }}{% endif %}</p>
    </div>
  </div>
  <button type="button" data-modal-close aria-label="Close" class="shrink-0 rounded-lg border border-stone-200 bg-white p-1 text-stone-500 hover:bg-stone-50">
    <i data-lucide="x" aria-hidden="true" class="h-4 w-4"></i>
  </button>
</div>
<div class="kt-modal-scroll min-h-0 flex-1 overflow-y-auto">
  {% include "accounts/_borrower_history_table.html" %}
</div>
<div class="flex shrink-0 justify-end border-t border-stone-200 bg-white px-5 py-3">
  <a href="{% url 'transactions:history' %}?q={{ borrower.id_number|urlencode }}" class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-[13px] font-semibold text-stone-700 hover:bg-stone-50">Open in Transaction History</a>
</div>
