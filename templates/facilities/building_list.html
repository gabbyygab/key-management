{% extends "base.html" %}
{% block title %}Buildings & Rooms — KEYTRACK{% endblock %}
{% block content %}
<div class="flex items-start justify-between flex-wrap gap-3 mb-4">
  <div>
    <h1 class="text-[22px] font-extrabold tracking-tight">Buildings &amp; Rooms</h1>
    <p class="text-[13px] text-stone-500 mt-0.5">Feeds the dashboard availability chart.</p>
  </div>
  <a href="{% url 'facilities:building_create' %}" class="bg-[#14342A] hover:bg-[#0F2E1F] text-white px-4 py-2 rounded-lg text-[13px] font-semibold">+ Add</a>
</div>
<div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4 divide-y divide-stone-100">
{% for b in buildings %}<div class="py-2.5 text-[13px] flex justify-between"><span><b class="font-mono">{{ b.code }}</b> <span class="text-stone-500">· {{ b.name }}</span></span><a href="{% url 'facilities:building_update' b.pk %}" class="font-medium hover:underline inline-flex items-center gap-1">Edit <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i></a></div>
{% empty %}<p class="text-stone-400 text-[13px]">No buildings yet.</p>{% endfor %}
</div>
{% endblock %}
