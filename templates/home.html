{% extends "base.html" %}

    <p class="mt-2 text-stone-500 text-[13px]">University Key Management. <a href="{% url 'accounts:login' %}" class="font-semibold underline">Log in</a></p>

{% endblock %}
{% block content_anon %}

    <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-8 max-w-md w-full text-center">
      <div class="flex justify-center"><i data-lucide="key-round" class="w-8 h-8"></i></div>
      <h1 class="text-2xl font-extrabold mt-2">KEYTRACK</h1>
      <p class="mt-1 text-stone-500 text-[13px]">University Key Management</p>

    </div>
  </div>
