{% extends "base.html" %}
{% load static %}
{% block title %}{{ title }} — KEYTRACK{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
  <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#1E6B4A]/10 border border-[#1E6B4A]/20 flex items-center justify-center text-[#1E6B4A] shrink-0">
        <i data-lucide="key" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-[18px] font-bold text-stone-900">{{ title }}</h1>
        <p class="text-[12px] text-stone-500">Physical key inventory record</p>
      </div>
    </div>
    <a href="{% url 'keys:key_list' %}" class="text-stone-400 hover:text-stone-600 p-1.5 rounded-lg border border-stone-200 bg-white" title="Return to key inventory">
      <i data-lucide="x" class="w-4 h-4"></i>
    </a>
  </div>

  {% include "keys/_key_form_modal.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/key-modal.js' %}"></script>
{% endblock %}
