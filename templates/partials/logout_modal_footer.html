<button type="button" data-modal-close class="rounded-lg border border-stone-200 bg-white px-4 py-2 text-[13px] font-semibold text-stone-700 hover:bg-stone-50">
  Cancel
</button>
<form method="post" action="{% url 'accounts:logout' %}">
  {% csrf_token %}
  <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-[#0F2E1F] px-4 py-2 text-[13px] font-semibold text-white hover:bg-[#143d28]">
    <i data-lucide="log-out" aria-hidden="true" class="h-4 w-4"></i>
    Log out
  </button>
</form>
