{# stat_card — label/value/sub. The icon is decorative; the label is the name. #}
<div class="bg-white rounded-xl border border-stone-200 shadow-sm p-4">
  <div class="flex items-start justify-between">
    <div class="text-[13px] text-stone-500">{{ label }}</div>
    <div aria-hidden="true" class="w-8 h-8 rounded-lg flex items-center justify-center {{ icon_bg|default:'bg-stone-100' }}"><i data-lucide="{{ icon|default:'key-round' }}" class="w-4 h-4"></i></div>
  </div>
  <div class="text-[26px] leading-8 font-extrabold mt-1">{{ value }}</div>
  {# stone-400 measured 2.52:1 on white — below the 4.5:1 AA floor (F6.7). #}
  <div class="text-[12px] text-stone-500 mt-0.5">{{ sub }}</div>
</div>
